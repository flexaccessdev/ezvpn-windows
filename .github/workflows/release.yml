name: release

on:
  # Like the sibling repos: the tag comes from the declared app version
  # (EzvpnAppVersion in Directory.Build.props), a run aborts if that tag already
  # exists (so every release needs a version bump), and it is a real release on
  # main, a prerelease from any other branch.
  workflow_dispatch:

jobs:
  release-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ezvpn-windows
        uses: actions/checkout@v4
        with:
          path: gui

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $props = [xml](Get-Content gui/Directory.Build.props)
          $version = "$($props.SelectSingleNode('//EzvpnAppVersion').InnerText)".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Could not parse EzvpnAppVersion from Directory.Build.props (got '$version')" }
          $tag = "v$version"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            $title = "Prerelease $tag"; $pre = "true"
          } else {
            $title = "Release $tag"; $pre = "false"
          }
          # A published release creates its tag; refuse to reuse a version.
          if (git -C gui ls-remote --tags origin "refs/tags/$tag") {
            throw "Tag $tag already exists on remote: bump EzvpnAppVersion in Directory.Build.props"
          }
          $now = (Get-Date).ToUniversalTime()
          # MSI ProductVersion stays derived from the build time — not the app
          # version — so it keeps increasing across every build ever shipped,
          # including the earlier timestamp-tagged ones (26.x), and MajorUpgrade
          # never sees a downgrade. MSI compares major.minor.build (major/minor <= 255,
          # build <= 65535; the 4th field is ignored), so encode the timestamp as
          # a monotonically increasing version that keeps MajorUpgrade working:
          #   major = years since 2000, minor = month, build = minutes into month.
          $major = $now.Year - 2000
          $minor = $now.Month
          $build = $now.Day * 1440 + $now.Hour * 60 + $now.Minute
          $product = "$major.$minor.$build.0"
          "product=$product"      >> $env:GITHUB_OUTPUT
          "release_tag=$tag"      >> $env:GITHUB_OUTPUT
          "release_title=$title"  >> $env:GITHUB_OUTPUT
          "is_prerelease=$pre"    >> $env:GITHUB_OUTPUT

      - name: Publish app (self-contained)
        shell: pwsh
        # No Rust / core build here: native.targets downloads the prebuilt,
        # SHA256-verified ezvpn.dll from the pinned ezvpn release (and wintun.dll
        # from wintun.net) during publish. Update the pin with scripts\bump-dll.ps1.
        run: |
          dotnet publish gui/src/Ezvpn.App/Ezvpn.App.csproj -c Release -r win-x64 --self-contained -o publish
          # Sanity: native.targets must have staged both DLLs into the publish output.
          if (-not (Test-Path publish/ezvpn.dll)) { throw "ezvpn.dll missing from publish" }
          if (-not (Test-Path publish/wintun.dll)) { throw "wintun.dll missing from publish" }

      - name: Build MSI
        shell: pwsh
        run: |
          $pub = (Resolve-Path publish).Path
          dotnet build gui/installer/Ezvpn.Installer.wixproj -c Release "-p:PublishDir=$pub" "-p:ProductVersion=${{ steps.ver.outputs.product }}"
          # Unversioned asset name, like the sibling repos; the tag carries the version.
          Copy-Item gui/installer/bin/Release/ezvpn.msi ezvpn.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezvpn-msi
          path: ezvpn.msi

      - name: Publish release
        # v<EzvpnAppVersion>: a real release on main, a prerelease elsewhere. The
        # tag is created on the triggering commit.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: ${{ steps.ver.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.ver.outputs.is_prerelease }}
          generate_release_notes: true
          files: ezvpn.msi
